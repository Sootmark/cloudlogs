[package]
name = "sootmark-cloudlogs"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "Cloud and SaaS audit logs for forensics: AWS CloudTrail, the Microsoft 365 unified audit log, Entra ID sign-ins and audits, Azure activity, Google Cloud audit logs; as exported (JSON, JSON lines, CSV)."
license = "MIT OR Apache-2.0"
repository = "https://github.com/Sootmark/cloudlogs"
homepage = "https://sootmark.com"
keywords = ["forensics", "dfir", "incident-response", "cloudtrail", "microsoft365"]
# Sources only: test fixtures stay in the repository.
include = ["/src", "/README.md", "/LICENSE-APACHE", "/LICENSE-MIT"]

[lib]
name = "cloudlogs"

[dependencies]
common = { package = "sootmark-common", version = "0.3.7" }

[dev-dependencies]
proptest = "1"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"
cast_precision_loss = "allow"
